  fromOutside: false

- id: update-record
  label: { ja: 更新の適用の記録, en: Update record }
  kind: data
  fromOutside: false

- id: authentication-rules
  label: { ja: パスワードと多要素認証の決まり, en: Authentication rules }
  description: { ja: パスワードの条件と、多要素認証を求める範囲を決めた社内の決まり。 }
  kind: document
  fromOutside: false

- id: mfa-status-list
  label: { ja: 多要素認証の登録の状況, en: MFA enrollment status }
  kind: data
  fromOutside: false

- id: credential-reset-request
  label: { ja: 認証情報の再設定の依頼, en: Credential reset request }
