# 情報システムの工程で受け渡される物。
# --- アカウントの発行と削除
- id: account-request
  label: { ja: アカウントの発行の依頼, en: Account request }
  description: { ja: 入社する人の氏名、所属、入社日、必要な道具を書いて、情報システムに出す依頼。 }
  kind: form
  fromOutside: false

- id: approved-permission-plan
  label: { ja: 承認された権限の案, en: Approved permission plan }
  description: { ja: 新しく入る人に付ける権限を、部門の責任者が決めた物。 }
  kind: form
  fromOutside: false

- id: account-record
  label: { ja: アカウントの記録, en: Account record }
  description: { ja: 発行したアカウントと、付けた権限の記録。 }
  kind: data
  fromOutside: false

- id: initial-login-notice
  label: { ja: 最初のログインの案内, en: Initial login notice }
  description: { ja: 初期の認証情報と、多要素認証の登録の手順を、本人に知らせる文面。 }
  kind: message
  fromOutside: false

- id: permission-change-record
  label: { ja: 権限の見直しの記録, en: Permission change record }
  description: { ja: 異動に合わせて付けた権限と外した権限の記録。 }
  kind: data
  fromOutside: false

- id: suspension-plan
  label: { ja: アカウント停止の段取り, en: Account suspension plan }
  description: { ja: 停止の日時、引き継ぐデータ、メールの扱いを決めた物。 }
  kind: document
  fromOutside: false

- id: handover-record
  label: { ja: データの引き継ぎの記録, en: Data handover record }
  kind: data
  fromOutside: false

- id: suspended-account-record
  label: { ja: アカウント停止の記録, en: Suspended account record }
  kind: data
  fromOutside: false

- id: deletion-record
  label: { ja: アカウント削除の記録, en: Account deletion record }
  kind: data
  fromOutside: false

# --- 端末
- id: device-request
  label: { ja: 端末の申請, en: Device request }
  description: { ja: 必要な端末の種類、使う人、理由を書いた申請。 }
  kind: form
  fromOutside: false

- id: approved-device-request
  label: { ja: 承認された端末の申請, en: Approved device request }
  kind: form
  fromOutside: false

- id: device-order
  label: { ja: 端末の発注, en: Device order }
  description: { ja: 購入する端末の数と仕様を、取引先に伝える発注。 }
  kind: message
  fromOutside: false
  recipient: vendor

- id: device-delivery-note
  label: { ja: 端末の納品書, en: Device delivery note }
  description: { ja: 取引先から端末と一緒に届く納品書。 }
  kind: document
  fromOutside: true
  sender: vendor

- id: asset-record
  label: { ja: 端末の台帳の記録, en: Asset record }
  description: { ja: 端末の種類、管理の番号、購入の日、使う人を記録した物。 }
  kind: data
  fromOutside: false

- id: configured-device-record
  label: { ja: 端末の設定の記録, en: Configured device record }
  kind: data
  fromOutside: false

- id: device-loan-record
  label: { ja: 端末の貸与の記録, en: Device loan record }
  description: { ja: 貸した端末、貸した日、受け取った本人の確認を記録した物。 }
  kind: form
  fromOutside: false

- id: device-incident-report
  label: { ja: 端末の紛失・故障の連絡, en: Device loss or failure report }
  description: { ja: 端末をなくした、盗まれた、壊れたときに、本人が出す連絡。 }
  kind: form
  fromOutside: false

- id: device-response-record
  label: { ja: 端末の紛失・故障への対応の記録, en: Device incident response record }
  kind: data
  fromOutside: false

- id: device-return-record
  label: { ja: 端末の返却の記録, en: Device return record }
  kind: data
  fromOutside: false

- id: wipe-record
  label: { ja: 端末の初期化の記録, en: Device wipe record }
  kind: data
  fromOutside: false

- id: disposal-record
  label: { ja: 端末の再利用・廃棄の記録, en: Device reuse or disposal record }
  kind: data
  fromOutside: false

# --- 権限とセキュリティの運用
- id: permission-request
  label: { ja: 権限の申請, en: Permission request }
