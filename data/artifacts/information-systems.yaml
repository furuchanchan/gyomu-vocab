  fromOutside: false

- id: credential-reset-record
  label: { ja: 認証情報の再設定の記録, en: Credential reset record }
  kind: data
  fromOutside: false

# --- 障害とセキュリティ事故
- id: incident-notice
  label: { ja: 障害や不審な動きの連絡, en: Incident notice }
