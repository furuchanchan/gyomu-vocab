# 人事・労務の工程で受け渡される物。
# --- 採用
- id: hiring-requisition
  label: { ja: 採用の依頼, en: Hiring requisition }
  description: { ja: 部署が、募集する職種、人数、時期、理由を書いて、人事に出す依頼。 }
  kind: form
  fromOutside: false

- id: approved-hiring-requisition
  label: { ja: 承認された採用の依頼, en: Approved hiring requisition }
  kind: form
  fromOutside: false

- id: job-posting
  label: { ja: 募集の内容, en: Job posting }
  description: { ja: 職種、仕事の内容、賃金、労働時間、勤務地などの労働条件を書いた、募集の文面。 }
  kind: document
  fromOutside: false

- id: published-job-posting
  label: { ja: 掲載した募集, en: Published job posting }
  description: { ja: 求人サイトや自社の採用ページなど、社外に出した募集。 }
  kind: message
  fromOutside: false
  recipient: applicant

- id: application-materials
  label: { ja: 応募書類, en: Application materials }
  kind: form
  fromOutside: true
  sender: applicant

- id: applicant-record
  label: { ja: 応募者の記録, en: Applicant record }
  description: { ja: 応募者の氏名、経歴、応募した職種、選考の進み具合を書いた記録。 }
  kind: data
  fromOutside: false

- id: screening-result
  label: { ja: 書類選考の結果, en: Screening result }
  kind: data
  fromOutside: false

- id: screening-notice
  label: { ja: 選考結果の連絡, en: Screening notice }
  kind: message
  fromOutside: false
  recipient: applicant

- id: interview-evaluation
  label: { ja: 面接の評価, en: Interview evaluation }
  kind: document
  fromOutside: false

- id: hiring-decision
  label: { ja: 採用の決定, en: Hiring decision }
  description: { ja: 誰を、どの職種と条件で採用するかの決定。 }
  kind: document
  fromOutside: false

- id: offer-terms
  label: { ja: 内定の条件, en: Offer terms }
  description: { ja: 職種、賃金、入社日、勤務地など、内定で示す条件をまとめた書類。 }
  kind: document
  fromOutside: false

- id: offer-notice
  label: { ja: 内定通知, en: Offer notice }
  kind: document
  fromOutside: false
  recipient: applicant

- id: offer-acceptance
  label: { ja: 内定の承諾, en: Offer acceptance }
  kind: form
  fromOutside: true
  sender: applicant

- id: accepted-offer-record
  label: { ja: 承諾された内定の記録, en: Accepted offer record }
  description: { ja: 入社する人の氏名、入社日、職種、合意した条件を書いた記録。 }
  kind: data
  fromOutside: false

# --- 入社の手続き
- id: employment-conditions-notice
  label: { ja: 労働条件通知書, en: Employment conditions notice }
  description: { ja: 労働契約の期間、就業の場所、仕事の内容、労働時間、賃金、退職に関する事項などを書いて、労働者に明示する書類。 }
  kind: document
  fromOutside: false

- id: new-hire-documents
  label: { ja: 入社の書類, en: New hire documents }
  description: { ja: 本人確認の書類、年金手帳や基礎年金番号の分かる書類、雇用保険の被保険者番号、給与の振込先、家族の情報など、入社の手続きに要る書類。 }
  kind: form
  fromOutside: false

- id: checked-new-hire-data
  label: { ja: 確かめた入社の情報, en: Checked new hire data }
  kind: data
  fromOutside: false

- id: employee-record
  label: { ja: 従業員の記録, en: Employee record }
  description: { ja: 氏名、住所、入社日、所属、雇用の形態など、従業員ごとの基本の情報。 }
  kind: data
  fromOutside: false

- id: insurance-eligibility-decision
  label: { ja: 加入する保険の判断, en: Insurance eligibility decision }
  description: { ja: 健康保険、厚生年金保険、雇用保険の、どれに加入する対象かを書いた判断。 }
  kind: document
  fromOutside: false

- id: health-pension-acquisition-report
  label: { ja: 健康保険・厚生年金保険の資格取得届, en: Health and pension insurance acquisition report }
  kind: form
  fromOutside: false
  recipient: pension-office

- id: employment-insurance-acquisition-report
  label: { ja: 雇用保険の資格取得届, en: Employment insurance acquisition report }
  kind: form
  fromOutside: false
  recipient: public-employment-office

- id: dependent-deduction-declaration
  label: { ja: 扶養控除等申告書（入社時）, en: Dependent deduction declaration at joining }
  description: { ja: 給与から源泉徴収する所得税の額を決めるために、従業員が出す申告書。 }
  kind: form
  fromOutside: false

- id: payroll-master-record
  label: { ja: 給与計算の基本情報, en: Payroll master record }
  description: { ja: 給与の額、手当、社会保険の加入状況、扶養の人数、振込先など、給与の計算に使う従業員ごとの情報。 }
  kind: data
  fromOutside: false

# --- 勤怠の集計と給与計算
- id: attendance-report
  label: { ja: 勤怠の申告, en: Attendance report }
  description: { ja: 従業員が、その月の出勤、労働時間、時間外・休日・深夜の労働、休暇を申告したデータ。 }
  kind: data
  fromOutside: false

- id: approved-attendance
  label: { ja: 承認された勤怠, en: Approved attendance }
  kind: data
  fromOutside: false

- id: attendance-summary
  label: { ja: 勤怠の集計, en: Attendance summary }
  description: { ja: 従業員ごとの、労働日数、労働時間、時間外・休日・深夜の労働時間、欠勤、有給休暇の日数を集計したデータ。 }
  kind: data
  fromOutside: false

- id: resident-tax-notice
  label: { ja: 住民税の特別徴収税額の通知, en: Resident tax special collection notice }
  description: { ja: 市区町村が、給与から引く住民税の額を、従業員ごとに知らせる通知。 }
  kind: document
  fromOutside: true
  sender: municipality

- id: payroll-calculation
  label: { ja: 給与の計算結果, en: Payroll calculation }
  description: { ja: 従業員ごとの、支給額、控除額、差引支給額、会社が負担する社会保険料の計算結果。 }
  kind: data
  fromOutside: false

- id: approved-payroll
  label: { ja: 承認された給与, en: Approved payroll }
  kind: data
  fromOutside: false

- id: payslip
  label: { ja: 給与明細, en: Payslip }
  kind: document
  fromOutside: false

- id: salary-transfer-instruction
  label: { ja: 給与の振込の依頼, en: Salary transfer instruction }
  kind: data
  fromOutside: false
  recipient: bank

- id: salary-payment-record
  label: { ja: 給与の支払の記録, en: Salary payment record }
  kind: data
  fromOutside: false

- id: wage-ledger
  label: { ja: 賃金台帳, en: Wage ledger }
  description: { ja: 賃金計算の基礎になる事項と賃金の額を、従業員ごとに、支払のたびに記録した台帳。 }
  kind: data
  fromOutside: false

- id: withholding-tax-payment-record
  label: { ja: 源泉所得税の納付の記録, en: Withholding tax payment record }
  kind: data
  fromOutside: false
  recipient: tax-office

- id: resident-tax-payment-record
  label: { ja: 住民税の納入の記録, en: Resident tax payment record }
  kind: data
  fromOutside: false
  recipient: municipality

- id: insurance-premium-notice
  label: { ja: 社会保険料の額の通知, en: Insurance premium notice }
  description: { ja: その月の健康保険料と厚生年金保険料の額を、年金事務所が事業主に知らせる書類。 }
  kind: document
  fromOutside: true
  sender: pension-office

- id: insurance-premium-payment-record
  label: { ja: 社会保険料の納付の記録, en: Insurance premium payment record }
  kind: data
  fromOutside: false
  recipient: pension-office

# --- 年末調整
- id: year-end-declaration-guide
  label: { ja: 年末調整の案内と様式, en: Year-end adjustment guide and forms }
  description: { ja: 提出の期限、書き方、様式を従業員に知らせる案内。 }
  kind: document
  fromOutside: false

- id: year-end-declarations
  label: { ja: 年末調整の申告書, en: Year-end adjustment declarations }
  description: { ja: 扶養控除等申告書、配偶者控除等申告書、基礎控除申告書、保険料控除申告書などと、控除の証明書。 }
  kind: form
  fromOutside: false

- id: checked-year-end-declarations
  label: { ja: 確かめた年末調整の申告書, en: Checked year-end adjustment declarations }
