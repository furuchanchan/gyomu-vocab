  fromOutside: false

- id: adjustment-settlement-record
  label: { ja: 年末調整の精算の記録, en: Year-end adjustment settlement record }
  description: { ja: 過不足を、最後の給与で還付または徴収した記録。 }
  kind: data
  fromOutside: false

- id: adjustment-tax-payment-record
  label: { ja: 年末調整の不足額の納付の記録, en: Year-end adjustment tax payment record }
  kind: data
  fromOutside: false
  recipient: tax-office

- id: withholding-slips
  label: { ja: 源泉徴収票, en: Withholding tax slips }
  kind: form
  fromOutside: false

- id: withholding-slip-filing
  label: { ja: 源泉徴収票の提出, en: Withholding slip filing }
  kind: form
  fromOutside: false
  recipient: tax-office

- id: payroll-report
  label: { ja: 給与支払報告書, en: Payroll report }
  kind: form
  fromOutside: false
  recipient: municipality

# --- 算定基礎届と年度更新
- id: remuneration-data
  label: { ja: 4月から6月の報酬のデータ, en: April to June remuneration data }
