- id: sales-rep
  label: { ja: 営業の担当, en: Sales representative }
  description: { ja: 見込み客や顧客に連絡し、商談、提案、見積、契約の手続きを進める役割。 }
  external: false
  occupation: jsoc-d
  occupationCode: "34"

- id: sales-manager
  label: { ja: 営業の責任者, en: Sales manager }
  description: { ja: 営業の担当の進め方を確かめ、値引きや契約の条件、稟議を承認する役割。 }
  external: false
  occupation: jsoc-a
  occupationCode: "03"

- id: sales-admin
  label: { ja: 営業事務の担当, en: Sales administrator }
  description: { ja: 受注の登録、納品の手配、請求の依頼の作成など、営業の事務を受け持つ役割。 }
  external: false
  occupation: jsoc-c
  occupationCode: "257"

- id: legal-staff
  label: { ja: 法務の担当, en: Legal staff }
  description: { ja: 契約書の案を読み、会社にとって不利な点や法令に合わない点を確かめる役割。 }
  external: false

- id: delivery-staff
  label: { ja: 納品・作業の担当, en: Delivery staff }
  description: { ja: 契約した物やサービスを、顧客に納めたり、作業として行ったりする役割。 }
  external: false

- id: prospect
  label: { ja: 見込み客, en: Prospect }
  description: { ja: まだ取引はないが、問い合わせや名刺の交換などで接点があり、取引の可能性がある相手。 }
  external: true
