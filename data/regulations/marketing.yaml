# マーケティングに関係する制度。
# legalBasis の条と officialGuidance のページは、contains の語が本文にあることを scripts/verify-sources.mjs で確かめる。
- id: personal-data-handling
  label: { ja: 個人データの安全管理と第三者提供の制限（個人情報保護法）, en: Security control and restriction on third-party provision of personal data }
  obligation:
    ja: 個人データの漏えい、滅失、毀損を防ぐなど、安全管理のために必要かつ適切な措置を講じる。個人データの取扱いを委託するときは、委託を受けた者に対して必要かつ適切な監督を行う。法令に基づく場合などの例外を除き、あらかじめ本人の同意を得ないで、個人データを第三者に提供してはならない。第三者に提供される個人データについて、本人の求めに応じて提供を停止することとし、あらかじめ本人に通知するか本人が容易に知り得る状態に置いて、個人情報保護委員会に届け出た場合は、同意なしに提供できる例外もある（要配慮個人情報などは除く）。利用目的の達成に必要な範囲で取扱いを委託することに伴って提供する場合、事業の承継に伴って提供する場合、特定の者と共同して利用する場合（所定の事項を通知するか、本人が容易に知り得る状態に置く）は、提供を受ける者は第三者に当たらない。
  appliesTo:
    ja: 個人情報取扱事業者。
  authority: { ja: 個人情報保護委員会, en: Personal Information Protection Commission }
  legalBasis:
    - law: 個人情報の保護に関する法律
      lawId: 415AC0000000057
      articles:
        - { article: "23", contains: [個人データの安全管理のために必要かつ適切な措置を講じなければならない] }
        - { article: "25", contains: [委託を受けた者に対する必要かつ適切な監督を行わなければならない] }
        - { article: "27", contains: [あらかじめ本人の同意を得ないで、個人データを第三者に提供してはならない, 法令に基づく場合, 第三者に該当しないものとする, 利用目的の達成に必要な範囲内において個人データの取扱いの全部又は一部を委託すること] }
  verifiedOn: 2026-09-30

- id: misleading-representation
  label: { ja: 不当な表示の禁止（景品表示法）, en: Prohibition of misleading representations }
  obligation:
    ja: 事業者は、自己が供給する商品や役務の取引について、次の表示をしてはならない。商品や役務の品質、規格その他の内容について、一般消費者に対し、実際のものよりも著しく優良であると示す表示（同種の他の事業者のものよりも著しく優良であると事実に相違して示す表示を含む）で、不当に顧客を誘引し、一般消費者による自主的かつ合理的な選択を阻害するおそれがあると認められるもの。価格その他の取引条件について、実際のものや他の事業者のものよりも取引の相手方に著しく有利であると一般消費者に誤認される表示で、同じおそれがあると認められるもの。このほか、取引に関する事項について一般消費者に誤認されるおそれがある表示で、内閣総理大臣が指定するもの。
  appliesTo:
    ja: 条文は「一般消費者に対し」「一般消費者に誤認される」と書いている。一般消費者に向けた表示に当たる場合に、この条が関わる。もっぱら法人だけを相手にした表示が対象になるかは、ここでは確かめていない。
  authority: { ja: 消費者庁, en: Consumer Affairs Agency }
  legalBasis:
    - law: 不当景品類及び不当表示防止法
      lawId: 337AC0000000134
      articles:
        - { article: "5", contains: [事業者は、自己の供給する商品又は役務の取引について, 実際のものよりも著しく優良であると示し, 一般消費者に誤認される表示, 一般消費者による自主的かつ合理的な選択を阻害するおそれがあると認められるもの, 内閣総理大臣が指定するもの] }
  officialGuidance:
    - url: https://www.caa.go.jp/policies/policy/representation/fair_labeling/
      contains: [景品表示法, 不当景品類及び不当表示防止法, 一般消費者]
  verifiedOn: 2026-09-30

- id: copyright-use
  label: { ja: 他人の著作物の利用と引用（著作権法）, en: Use and quotation of others' copyrighted works }
  obligation:
    ja: 著作者は、その著作物を複製する権利と、公衆送信を行う権利（自動公衆送信の場合は送信可能化を含む）を専有する。公表された著作物は、その引用が公正な慣行に合致し、報道、批評、研究その他の引用の目的上正当な範囲内で行われるなら、引用して利用できる。このほか、著作物に表現された思想や感情を自ら享受し、または他人に享受させることを目的としない場合は、必要と認められる限度で利用できる。ただし、著作物の種類と用途、利用の態様に照らして著作権者の利益を不当に害する場合は除く。
  appliesTo:
    ja: 他人の著作物をコンテンツにのせて複製したり、Webで送信したりする場合。
  authority: { ja: 文化庁, en: Agency for Cultural Affairs }
  legalBasis:
    - law: 著作権法
      lawId: 345AC0000000048
      articles:
        - { article: "21", contains: [その著作物を複製する権利を専有する] }
        - { article: "23", contains: [公衆送信, 送信可能化を含む, 権利を専有する] }
        - { article: "30_4", contains: [思想又は感情を自ら享受し又は他人に享受させることを目的としない場合, 著作権者の利益を不当に害することとなる場合] }
        - { article: "32", contains: [公表された著作物は、引用して利用することができる, 公正な慣行に合致するものであり, 引用の目的上正当な範囲内] }
  verifiedOn: 2026-09-30

- id: trademark-rights
  label: { ja: 他社の登録商標の扱い（商標法）, en: Handling of others' registered trademarks }
  obligation:
    ja: 商標権者は、指定商品や指定役務について、登録商標の使用をする権利を専有する（専用使用権を設定した場合を除く）。指定商品や指定役務についての登録商標に類似する商標を使うことなどは、商標権の侵害とみなされる。ただし、自己の氏名や名称を普通に用いられる方法で表示する商標や、商品の普通名称などを普通に用いられる方法で表示する商標には、商標権の効力が及ばない。
  appliesTo:
    ja: 他社の登録商標や、それに類似する商標をコンテンツに使う場合。
  authority: { ja: 特許庁, en: Japan Patent Office }
  legalBasis:
    - law: 商標法
      lawId: 334AC0000000127
      articles:
        - { article: "25", contains: [指定商品又は指定役務について登録商標の使用をする権利を専有する] }
        - { article: "26", contains: [商標権の効力は、次に掲げる商標, 普通名称, には、及ばない] }
        - { article: "37", contains: [侵害するものとみなす, 登録商標に類似する商標の使用] }
  verifiedOn: 2026-09-30

- id: specified-email-consent-record
  label: { ja: 送信の同意の記録の保存（特定電子メール法）, en: Keeping records of consent to advertising email }
  obligation:
    ja: 広告や宣伝の電子メールを送るように求めた者や同意した者にだけ送る場合、その求めや同意があったことを証する記録を保存する。保存の方法は、通知を受けた時期や方法などを示す記録か、宛先にできるメールアドレスが特定できる記録と通知に係る定型的な事項の記録を、必要に応じて提示できる方法とする。保存の期間は、そのメールを送らないと決めた日までか、送った場合は最後に送った日から起算して1月を経過する日まで。ただし、命令を受けた場合には、最後に送った日から起算して1年を経過する日まで延びる場合がある。
  deadline:
    ja: 最後に送った日から起算して1月を経過する日まで（送らないと決めたときは、その日まで）。
  appliesTo:
    ja: 送るように求めた者や同意した者に広告・宣伝の電子メールを送る、営利を目的とする団体と営業を営む場合の個人。
  authority: { ja: 消費者庁、総務省, en: "Consumer Affairs Agency, Ministry of Internal Affairs and Communications" }
  legalBasis:
    - law: 特定電子メールの送信の適正化等に関する法律
      lawId: 414AC0100000026
      articles:
        - { article: "3", contains: [送信をすることに同意があったことを証する記録を保存しなければならない] }
    - law: 特定電子メールの送信の適正化等に関する法律施行規則
      lawId: 414M60000008066
      articles:
        - { article: "4", contains: [必要に応じ提示することができる方法, 当該送信を最後にした日から起算して一月を経過する日までの間, 当該送信をしないこととした日までの間, 一年を経過する日] }
  verifiedOn: 2026-09-30
