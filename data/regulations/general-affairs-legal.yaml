# 総務・法務に関係する制度。
# legalBasis の条と officialGuidance のページは、contains の語が本文にあることを scripts/verify-sources.mjs で確かめる。
- id: shareholders-meeting-convocation
  label: { ja: 株主総会の招集の決定と通知（会社法）, en: Convening a shareholders meeting and giving notice }
  obligation:
    ja: 定時株主総会は、毎事業年度の終了後、一定の時期に招集する。株主総会は、取締役が招集する。招集するときは、取締役が、株主総会の日時と場所、株主総会の目的である事項などを定める。取締役会を置く会社では、これらの決定は取締役会の決議で行う。招集の通知は、株主総会の日の2週間前までに、株主に対して発する。公開会社でない株式会社は1週間前まででよいが、書面か電磁的方法による議決権の行使を認めるときは2週間前まで。通知は、取締役会を置く会社と、書面か電磁的方法による議決権の行使を認める会社では書面で行い、株主の承諾を得れば電磁的方法でもよい。通知には、株主総会の日時と場所、目的である事項などを書く。基準日を定めるときは、基準日から3か月以内に行使する権利に限る。
  deadline:
    ja: 通知は、株主総会の日の2週間前まで。公開会社でない株式会社は1週間前まで（書面か電磁的方法による議決権の行使を認めるときは2週間前まで）。基準日株主が行使する権利は、基準日から3か月以内のもの。
  appliesTo:
    ja: 株式会社。取締役会を置くかどうかと、公開会社かどうかで、決め方と期限が変わる。
  authority: { ja: 法務省, en: Ministry of Justice }
  legalBasis:
    - law: 会社法
      lawId: 417AC0000000086
      articles:
        - { article: "124", contains: [基準日, 基準日から三箇月以内に行使するもの] }
        - { article: "296", contains: [定時株主総会は、毎事業年度の終了後一定の時期に招集しなければならない, 取締役が招集する] }
        - { article: "298", contains: [株主総会の日時及び場所, 株主総会の目的である事項, 第一項各号に掲げる事項の決定は、取締役会の決議によらなければならない] }
        - { article: "299", contains: [株主総会の日の二週間, 公開会社でない株式会社にあっては、一週間, その通知を発しなければならない, 書面でしなければならない, 政令で定めるところにより、株主の承諾を得て、電磁的方法により通知を発することができる] }
  verifiedOn: 2026-09-30

- id: shareholders-meeting-minutes
  label: { ja: 株主総会の議事録の作成と備置き（会社法）, en: Preparing and keeping the minutes of a shareholders meeting }
  obligation:
    ja: 株主総会の議事については、議事録を作る。議事録は、書面か電磁的記録で作る。議事録には、株主総会を開いた日時と場所、議事の経過の要領とその結果、出席した取締役などの氏名、議長がいるときは議長の氏名、議事録の作成に係る職務を行った取締役の氏名を書く。株式会社は、株主総会の日から10年間、議事録を本店に備え置く。議事録の写しは、支店に5年間備え置く（電磁的記録で作り、支店で閲覧などに応じられる措置をとっている場合は、備え置かなくてよい）。株主と債権者は、営業時間内は、いつでも、議事録の閲覧か謄写を請求できる。
  deadline:
    ja: 株主総会の日から、本店で10年間。支店で写しを5年間。
  appliesTo:
    ja: 株式会社。
  authority: { ja: 法務省, en: Ministry of Justice }
  legalBasis:
    - law: 会社法
      lawId: 417AC0000000086
      articles:
        - { article: "318", contains: [議事録を作成しなければならない, 株主総会の日から十年間, その本店に備え置かなければならない, 株主総会の日から五年間, 閲覧又は謄写の請求] }
    - law: 会社法施行規則
      lawId: 418M60000010012
      articles:
        - { article: "72", contains: [書面又は電磁的記録をもって作成しなければならない, 株主総会が開催された日時及び場所, 株主総会の議事の経過の要領及びその結果, 議事録の作成に係る職務を行った取締役の氏名] }
  verifiedOn: 2026-09-30

- id: board-meeting-resolution
  label: { ja: 取締役会の招集と決議（会社法）, en: Convening a board of directors meeting and passing resolutions }
  obligation:
    ja: 取締役会は、各取締役が招集する。招集する取締役を定款か取締役会で決めたときは、その取締役が招集する。招集する人は、取締役会の日の1週間前までに、各取締役（監査役を置く会社では、各取締役と各監査役）に通知を発する。1週間より短い期間を定款で定めているときは、その期間による。取締役と監査役の全員が同意すれば、招集の手続きをとらずに開ける。決議は、議決に加わることができる取締役の過半数が出席し、その過半数で行う。定款でこれより高い割合を定めることもできる。決議について特別の利害関係を有する取締役は、議決に加われない。
  deadline:
    ja: 招集の通知は、取締役会の日の1週間前まで（定款で短くできる）。
  appliesTo:
    ja: 取締役会を置く株式会社。
  authority: { ja: 法務省, en: Ministry of Justice }
  legalBasis:
    - law: 会社法
      lawId: 417AC0000000086
      articles:
        - { article: "366", contains: [取締役会は、各取締役が招集する, 招集権者] }
        - { article: "368", contains: [取締役会の日の一週間, 各取締役, その通知を発しなければならない, 全員の同意があるときは、招集の手続を経ることなく開催することができる] }
        - { article: "369", contains: [議決に加わることができる取締役の過半数, 特別の利害関係を有する取締役は、議決に加わることができない] }
  verifiedOn: 2026-09-30

- id: board-meeting-minutes
  label: { ja: 取締役会の議事録の作成と備置き（会社法）, en: Preparing and keeping the minutes of a board of directors meeting }
  obligation:
    ja: 取締役会の議事については、議事録を作る。議事録は、書面か電磁的記録で作る。議事録には、取締役会を開いた日時と場所、議事の経過の要領とその結果、決議について特別の利害関係を有する取締役がいるときはその氏名、議長がいるときは議長の氏名などを書く。書面で作ったときは、出席した取締役と監査役が、署名するか記名押印する。電磁的記録で作ったときは、法務省令で定める署名や記名押印に代わる措置をとる。議事録に異議をとどめない取締役は、決議に賛成したものと推定される。取締役会設置会社は、取締役会の日から10年間、議事録を本店に備え置く。株主は、権利を行使するために必要があるときは、議事録の閲覧か謄写を請求できる（監査役設置会社などでは、裁判所の許可が要る）。
  deadline:
    ja: 取締役会の日から、本店で10年間。
  appliesTo:
    ja: 取締役会を置く株式会社。
  authority: { ja: 法務省, en: Ministry of Justice }
  legalBasis:
    - law: 会社法
      lawId: 417AC0000000086
      articles:
        - { article: "369", contains: [議事録を作成し, 署名し、又は記名押印しなければならない, 議事録に異議をとどめないものは、その決議に賛成したものと推定する] }
        - { article: "371", contains: [取締役会の日, から十年間, その本店に備え置かなければならない, 閲覧又は謄写の請求, 裁判所の許可を得て] }
    - law: 会社法施行規則
      lawId: 418M60000010012
      articles:
        - { article: "101", contains: [書面又は電磁的記録をもって作成しなければならない, 取締役会が開催された日時及び場所, 取締役会の議事の経過の要領及びその結果, 特別の利害関係を有する取締役があるときは、当該取締役の氏名] }
  verifiedOn: 2026-09-30

- id: commercial-registration-change
  label: { ja: 会社の登記事項の変更の登記（会社法・商業登記法）, en: Registering changes to a company's registered particulars }
  obligation:
    ja: 会社の登記事項に変更が生じたときは、2週間以内に、本店の所在地で変更の登記をする。登記事項には、商号、本店と支店の所在場所、取締役の氏名、代表取締役の氏名と住所などがある。本店を他の登記所の管轄区域内に移すときは、2週間以内に、旧所在地では移転の登記を、新所在地では登記事項の登記をする。登記の申請は、申請書に、申請人の商号と本店と代表者の氏名、登記の事由、登記すべき事項、登録免許税の額などを書き、申請人か代表者か代理人が記名押印して出す。代理人が申請するときは、その権限を証する書面を付ける。株主総会か取締役会の決議が要る事項の登記には、その議事録を付ける。登記を怠ったときは、取締役などが100万円以下の過料に処される。取締役の任期は、原則として、選任後2年以内に終了する事業年度のうち最終のものに関する定時株主総会の終結の時まで。公開会社でない株式会社（監査等委員会設置会社と指名委員会等設置会社を除く）は、定款で最長10年まで伸ばせる。
  deadline:
    ja: 変更が生じたときから、本店の所在地で2週間以内。
  appliesTo:
    ja: 株式会社。登記の申請を司法書士に頼む場合も、期限と必要な議事録は同じ。
  authority: { ja: 法務省（法務局）, en: Ministry of Justice (Legal Affairs Bureau) }
  legalBasis:
    - law: 会社法
      lawId: 417AC0000000086
      articles:
        - { article: "332", contains: [選任後二年以内に終了する事業年度のうち最終のものに関する定時株主総会の終結の時まで, 選任後十年以内に終了する事業年度のうち最終のものに関する定時株主総会の終結の時まで] }
        - { article: "911", contains: [本店及び支店の所在場所, 取締役（監査等委員会設置会社の取締役を除く。）の氏名, 代表取締役の氏名及び住所] }
        - { article: "915", contains: [変更が生じたときは、二週間以内に, 本店の所在地において、変更の登記をしなければならない] }
        - { article: "916", contains: [他の登記所の管轄区域内に移転したときは、二週間以内に, 旧所在地においては移転の登記をし] }
        - { article: "976", contains: [百万円以下の過料に処する, この法律の規定による登記をすることを怠ったとき] }
    - law: 商業登記法
      lawId: 338AC0000000125
      articles:
        - { article: "17", contains: [登記の事由, 登記すべき事項, 登録免許税の額, 記名押印しなければならない] }
        - { article: "18", contains: [代理人によつて登記を申請するには, 権限を証する書面を添付しなければならない] }
        - { article: "46", contains: [株主総会若しくは種類株主総会、取締役会又は清算人会の決議を要するときは、申請書にその議事録を添付しなければならない] }
  officialGuidance:
    - url: https://houmukyoku.moj.go.jp/homu/COMMERCE_11-1.html
      contains: [株式会社の役員変更登記の場合、登記の事由が発生した時から、本店の所在地において、2週間以内にしなければならない]
  verifiedOn: 2026-09-30

- id: company-books-retention
  label: { ja: 会計帳簿と事業に関する重要な資料の保存（会社法）, en: Retention of accounting books and important business materials }
  obligation:
    ja: 株式会社は、会計帳簿の閉鎖の時から10年間、その会計帳簿と、事業に関する重要な資料を保存する。
  deadline:
    ja: 会計帳簿の閉鎖の時から10年間。
  appliesTo:
    ja: 株式会社。
  authority: { ja: 法務省, en: Ministry of Justice }
  legalBasis:
    - law: 会社法
      lawId: 417AC0000000086
      articles:
        - { article: "432", contains: [会計帳簿の閉鎖の時から十年間, その事業に関する重要な資料を保存しなければならない] }
  verifiedOn: 2026-09-30

- id: personal-data-erasure
  label: { ja: 利用する必要がなくなった個人データの消去（個人情報保護法）, en: Erasing personal data that is no longer needed }
  obligation:
    ja: 個人情報取扱事業者は、利用目的の達成に必要な範囲内で、個人データを正確かつ最新の内容に保つ。そして、個人データを利用する必要がなくなったときは、遅滞なく消去するよう努める。
  deadline:
    ja: 利用する必要がなくなったとき、遅滞なく（努力義務）。
  appliesTo:
    ja: 個人情報取扱事業者。
  authority: { ja: 個人情報保護委員会, en: Personal Information Protection Commission }
  legalBasis:
    - law: 個人情報の保護に関する法律
      lawId: 415AC0000000057
      articles:
        - { article: "22", contains: [正確かつ最新の内容に保つ, 利用する必要がなくなったときは、当該個人データを遅滞なく消去するよう努めなければならない] }
  verifiedOn: 2026-09-30
