# カスタマーサポートに関係する制度。
# legalBasis の条と officialGuidance のページは、contains の語が本文にあることを scripts/verify-sources.mjs で確かめる。
- id: personal-data-requests
  label: { ja: 保有個人データの開示・訂正・利用停止の求めへの対応（個人情報保護法）, en: Responding to requests for disclosure, correction and suspension of use of retained personal data }
  obligation:
    ja: 本人から、自分が識別される保有個人データの利用目的の通知を求められたときは、遅滞なく通知する。開示、訂正・追加・削除、利用の停止・消去、第三者への提供の停止を請求されたときは、遅滞なく対応する。開示は、請求された方法で行い、その方法が難しいときは書面の交付で行う。開示しないと決めたときや、データが存在しないときは、遅滞なくその旨を本人に通知する。訂正等では、利用目的の達成に必要な範囲で遅滞なく調査して訂正等を行い、行った内容か行わない旨を本人に通知する。利用停止等の請求は、法に違反して取り扱われているときなど法が定める場合に、請求に理由があれば遅滞なく行い、行った旨か行わない旨を通知する。求めや請求を受け付ける方法は事業者が定めてよく、対象のデータを特定するための事項の提示を求めることができる。本人は代理人によっても請求できる。手続を定めるときは、本人に過重な負担を課さないよう配慮する。開示と利用目的の通知では、実費を勘案して合理的と認められる範囲で手数料を定めて徴収できる。
  deadline:
    ja: 遅滞なく。個人情報保護委員会のQ&Aは、検索や集約などの作業が要るときは、その作業に通常必要な期間も考慮した合理的な期間内に開示すれば、遅滞なく開示したことになると考えられる、としている。
  appliesTo:
    ja: 保有個人データを扱う個人情報取扱事業者。
  authority: { ja: 個人情報保護委員会, en: Personal Information Protection Commission }
  legalBasis:
    - law: 個人情報の保護に関する法律
      lawId: 415AC0000000057
      articles:
        - { article: "32", contains: [本人の知り得る状態, 利用目的の通知を求められたときは, 遅滞なく、これを通知しなければならない] }
        - { article: "33", contains: [開示を請求することができる, 遅滞なく、当該保有個人データを開示しなければならない, 書面の交付による方法] }
        - { article: "34", contains: [訂正、追加又は削除, 遅滞なく必要な調査を行い, 訂正等を行わない旨の決定をしたときは] }
        - { article: "35", contains: [利用の停止又は消去, 遅滞なく、当該保有個人データの利用停止等を行わなければならない] }
        - { article: "37", contains: [受け付ける方法を定めることができる, 特定するに足りる事項の提示を求めることができる, 代理人によってすることができる, 過重な負担を課するものとならないよう] }
        - { article: "38", contains: [手数料を徴収することができる, 実費を勘案して合理的であると認められる範囲内] }
  officialGuidance:
    - url: https://www.ppc.go.jp/all_faq_index/faq1-q9-12/
      contains: [遅滞なく, 理由のない滞りを生じさせることなく, 合理的な期間内に開示]
    - url: https://www.ppc.go.jp/all_faq_index/faq1-q9-29/
      contains: [手数料, 実費を勘案して合理的であると認められる範囲内]
  verifiedOn: 2026-09-30

- id: distance-selling
  label: { ja: 通信販売の広告の表示と申込みの撤回等（特定商取引法）, en: Advertising and withdrawal or cancellation rules for mail-order sales }
  obligation:
    ja: 通信販売で商品や役務の広告をするときは、販売価格か役務の対価（送料を含む）、代金の支払の時期と方法、商品の引渡時期か役務の提供時期、申込みの期間の定めがあるときはその内容、申込みの撤回や解除に関する事項（返品の特約があるときはその内容を含む）などを広告に表示する。商品や特定権利の通信販売では、購入者は、商品の引渡しか権利の移転を受けた日から数えて8日を経過するまでの間、申込みの撤回か契約の解除ができる。ただし、販売業者が撤回等についての特約を広告に表示していたときは、その特約による。撤回等があった場合の商品の引取りか返還の費用は、購入者が負担する。
  deadline:
    ja: 商品の引渡しを受けた日から起算して8日を経過するまで（広告に返品の特約の表示がない場合）。
  appliesTo:
    ja: 個人の消費者に向けて、広告をして郵便、電話、インターネットなどで申込みを受ける通信販売をする、販売業者と役務提供事業者。購入者が営業のために、または営業として契約する取引と、国外にいる相手への販売や役務の提供には、この規定は適用されない。
  authority: { ja: 消費者庁, en: Consumer Affairs Agency }
  legalBasis:
    - law: 特定商取引に関する法律
      lawId: 351AC0000000057
      articles:
        - { article: "11", contains: [通信販売についての広告, 申込みの撤回又は解除に関する事項, 販売価格又は役務の対価] }
        - { article: "15_3", contains: [通信販売における契約の解除等, 八日を経過するまでの間, その引取り又は返還に要する費用は、購入者の負担とする] }
        - { article: "26", contains: [営業のために若しくは営業として締結するもの, 本邦外に在る者に対する商品若しくは権利の販売又は役務の提供] }
  officialGuidance:
    - url: https://www.no-trouble.caa.go.jp/what/mailorder/
      contains: [8日以内, 返品特約, 事業者の氏名(名称)、住所、電話番号]
  verifiedOn: 2026-09-30

- id: consumer-contract-act
  label: { ja: 消費者との契約のルール（消費者契約法）, en: Rules for contracts with consumers }
  obligation:
    ja: 事業者が個人の消費者と結ぶ契約に適用される。事業者は、契約の条項を明確で平易なものにすることに配慮し、勧誘のときは消費者の年齢、心身の状態、知識、経験を考慮して必要な情報を提供し、消費者に求められたときは、契約で定められた解除権の行使に必要な情報を提供するよう努める。消費者は、事業者が勧誘のときに重要事項について事実と異なることを告げたなど法が定める行為により誤認して契約の申込みかその承諾をしたときは、契約の意思表示を取り消すことができる。契約の解除に伴う損害賠償の額を予定する条項や違約金の条項は、同種の契約の解除に伴い事業者に生ずる平均的な損害の額を超える部分が無効になる。
  appliesTo:
    ja: 消費者（事業として、または事業のために契約する場合を除く個人）と結ぶ契約の当事者になる事業者。法人の顧客との契約には適用されない。
  authority: { ja: 消費者庁, en: Consumer Affairs Agency }
  legalBasis:
    - law: 消費者契約法
      lawId: 412AC0000000061
      articles:
        - { article: "2", contains: [個人（事業として又は事業のために契約の当事者となる場合におけるものを除く。）, 消費者と事業者との間で締結される契約] }
        - { article: "3", contains: [事業者は、次に掲げる措置を講ずるよう努めなければならない, 解除権の行使に関して必要な情報を提供すること] }
        - { article: "4", contains: [取り消すことができる, 重要事項について事実と異なることを告げること] }
        - { article: "9", contains: [平均的な損害の額を超えるもの, 当該超える部分] }
  verifiedOn: 2026-09-30

- id: product-liability
  label: { ja: 製品の欠陥による損害賠償の責任（製造物責任法）, en: Liability for damage caused by product defects }
  obligation:
    ja: 製造物の製造業者、加工した者、輸入した者と、製造業者と誤認させる表示をした者などは、引き渡した製造物の欠陥により他人の生命、身体または財産を侵害したときは、これによって生じた損害を賠償する責任を負う。ただし、損害がその製造物だけに生じたときは、この責任を負わない。欠陥とは、その製造物が通常有すべき安全性を欠いていることをいう。
  appliesTo:
    ja: 製造または加工された動産（製造物）の製造業者等（業として製造、加工、輸入した者と、自らの氏名や商標などを製造業者として表示した者など）。サービスだけを提供する会社や、製造物を扱わない会社には当てはまらない。
  authority: { ja: 消費者庁, en: Consumer Affairs Agency }
  legalBasis:
    - law: 製造物責任法
      lawId: 406AC0000000085
      articles:
        - { article: "2", contains: [製造又は加工された動産, 通常有すべき安全性を欠いていること, 業として製造、加工又は輸入した者] }
        - { article: "3", contains: [これによって生じた損害を賠償する責めに任ずる, 生命、身体又は財産を侵害したとき, その損害が当該製造物についてのみ生じたときは、この限りでない] }
  verifiedOn: 2026-09-30

